<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>📚 La bibliothèque du KotArdoise</title>
  <link rel="stylesheet" href="styles/advanced-animations.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 4rem;
      font-size: 3.5rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
      letter-spacing: -1px;
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    
    .search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
      position: relative;
      width: 100%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .ai-search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 3.5rem;
      position: relative;
      width: 100%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    
    #search {
      padding: 1.25rem 1.75rem 1.25rem 3.5rem;
      width: 100%;
      max-width: 600px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      font-weight: 400;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    #ai-search {
      padding: 1.25rem 1.75rem 1.25rem 3.5rem;
      width: 100%;
      max-width: 600px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      font-weight: 400;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    #search:focus {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(102, 126, 234, 0.2);
      background: white;
      border: 1px solid rgba(102, 126, 234, 0.3);
    }
    
    #ai-search:focus {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(102, 126, 234, 0.2);
      background: white;
      border: 1px solid rgba(102, 126, 234, 0.3);
    }
    
    .search-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      color: #666;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    
    .ai-search-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      color: #666;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    
    #search:focus + .search-icon,
    #ai-search:focus + .ai-search-icon {
      color: #667eea;
      transform: translateY(-50%) scale(1.1);
    }
    
    .reset-container {
      display: flex;
      justify-content: center;
      margin-bottom: 3rem;
      width: 100%;
    }
    
    .reset-button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }
    
    .reset-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.6s ease;
    }
    
    .reset-button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15), 0 4px 15px rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.4);
    }
    
    .reset-button:hover::before {
      left: 100%;
    }
    
    .reset-button:active {
      transform: translateY(-1px);
    }
    
    .books-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      margin-top: 3rem;
      width: 100%;
      padding: 0;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .book {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(25px);
      border-radius: 24px;
      padding: 1.75rem;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.12),
        0 8px 25px rgba(0, 0, 0, 0.08),
        0 2px 10px rgba(0, 0, 0, 0.04);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: visible;
      width: 100%;
      min-width: 0;
      max-width: none;
    }
    
    /* Ligne de dégradé supprimée pour améliorer l'esthétique */
    
    .book::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
      border-radius: 24px;
    }
    
    .book:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow:
        0 35px 80px rgba(0, 0, 0, 0.18),
        0 15px 35px rgba(0, 0, 0, 0.12),
        0 5px 15px rgba(102, 126, 234, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
    }
    
    .book-content {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      position: relative;
      z-index: 1;
      width: 100%;
      overflow: visible;
    }
    
    .book-cover {
      position: relative;
      flex-shrink: 0;
    }
    
    .book-cover::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      border-radius: 18px;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }
    
    .book:hover .book-cover::before {
      opacity: 1;
    }
    
    img {
      width: 130px;
      height: auto;
      max-height: 190px;
      object-fit: contain;
      border-radius: 16px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.2),
        0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .book:hover img {
      transform: scale(1.08) rotateY(5deg);
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25),
        0 8px 20px rgba(0, 0, 0, 0.15);
    }
    
    .info {
      flex: 1;
      min-width: 0;
      overflow: visible;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }
    
    .info h2 {
      margin: 0 0 1rem;
      font-size: 1.4rem;
      font-weight: 600;
      color: #2d3748;
      line-height: 1.25;
      word-wrap: break-word;
      position: relative;
      padding-bottom: 0.5rem;
    }
    
    .info h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 1px;
    }
    
    .info-item {
      display: flex;
      align-items: flex-start;
      margin: 0.75rem 0;
      padding: 0.75rem;
      min-width: 0;
      gap: 1rem;
      background: rgba(248, 250, 252, 0.6);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: visible;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    
    .info-item:hover {
      background: rgba(102, 126, 234, 0.08);
      border-color: rgba(102, 126, 234, 0.2);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    
    .info-label {
      font-weight: 600;
      color: #4a5568;
      min-width: 80px;
      font-size: 0.875rem;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }
    
    .info-value {
      color: #2d3748;
      font-weight: 400;
      flex: 1;
      word-wrap: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      width: 100%;
      font-size: 0.95rem;
      line-height: 1.5;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 24px;
    }
    
    .stock-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 1.25rem;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      background: linear-gradient(135deg, #48bb78, #38a169);
      color: white;
      box-shadow:
        0 6px 20px rgba(72, 187, 120, 0.3),
        0 3px 10px rgba(72, 187, 120, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      white-space: nowrap;
      flex-shrink: 0;
      position: relative;
      overflow: visible;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      min-width: fit-content;
      width: auto;
      backdrop-filter: blur(5px);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }
    
    .stock-badge::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s ease;
    }
    
    .stock-badge:hover::before {
      left: 100%;
    }
    
    .stock-badge.out-of-stock {
      background: linear-gradient(135deg, #f56565, #e53e3e);
      box-shadow:
        0 6px 20px rgba(245, 101, 101, 0.3),
        0 3px 10px rgba(245, 101, 101, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    .stock-badge.undefined {
      background: linear-gradient(135deg, #a0aec0, #718096);
      box-shadow:
        0 6px 20px rgba(160, 174, 192, 0.3),
        0 3px 10px rgba(160, 174, 192, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    .stock-badge:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow:
        0 8px 25px rgba(72, 187, 120, 0.4),
        0 4px 15px rgba(72, 187, 120, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .stock-badge.out-of-stock:hover {
      box-shadow:
        0 8px 25px rgba(245, 101, 101, 0.4),
        0 4px 15px rgba(245, 101, 101, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .stock-badge.undefined:hover {
      box-shadow:
        0 8px 25px rgba(160, 174, 192, 0.4),
        0 4px 15px rgba(160, 174, 192, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 300px;
      color: white;
      font-size: 1.3rem;
      font-weight: 500;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1.5rem;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin: 4rem 0 3rem;
      flex-wrap: wrap;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(15px);
    }
    
    .pagination button {
      padding: 1rem 1.25rem;
      border: none;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      color: #4a5568;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(15px);
      min-width: 50px;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .pagination button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
      transition: left 0.6s ease;
    }
    
    .pagination button:hover:not(:disabled) {
      background: white;
      transform: translateY(-3px) scale(1.05);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.2),
        0 4px 12px rgba(102, 126, 234, 0.1);
      border-color: rgba(102, 126, 234, 0.3);
    }
    
    .pagination button:hover:not(:disabled)::before {
      left: 100%;
    }
    
    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    
    .pagination button.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow:
        0 8px 25px rgba(102, 126, 234, 0.5),
        0 4px 15px rgba(102, 126, 234, 0.3);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
    }
    
    .pagination .page-info {
      color: white;
      font-weight: 600;
      margin: 0 1.5rem;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      backdrop-filter: blur(15px);
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }
    
    .results-info {
      text-align: center;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 2rem;
      font-size: 1rem;
      font-weight: 500;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    
    .results-info strong {
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    
    .no-results {
      text-align: center;
      color: white;
      font-size: 1.5rem;
      margin-top: 4rem;
      opacity: 0.9;
      padding: 3rem 2rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      font-weight: 500;
    }
    @media (max-width: 1024px) {
      .container {
        padding: 2.5rem 1.5rem;
      }
      
      .books-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
        padding: 0;
      }
      
      h1 {
        font-size: 3rem;
        margin-bottom: 3.5rem;
      }
      
      .book {
        padding: 1.5rem;
      }
      
      img {
        width: 120px;
        max-height: 175px;
      }
    }
    
    /* Tablettes en mode paysage et petits écrans */
    @media (max-width: 768px) {
      .container {
        padding: 2rem 1rem;
      }
      
      h1 {
        font-size: 2.5rem;
        margin-bottom: 3rem;
        line-height: 1.15;
      }
      
      .search-container {
        margin-bottom: 1.75rem;
        padding: 0 0.5rem;
        max-width: 100%;
      }
      
      .ai-search-container {
        margin-bottom: 2.5rem;
        padding: 0 0.5rem;
        max-width: 100%;
      }
      
      .reset-container {
        margin-bottom: 2rem;
        padding: 0 0.5rem;
      }
      
      .reset-button {
        font-size: 0.9rem;
        padding: 0.875rem 1.5rem;
      }
      
      #search {
        max-width: 100%;
        font-size: 1rem;
        padding: 1rem 1.5rem 1rem 3rem;
        border-radius: 25px;
      }
      
      #ai-search {
        width: 100%;
        font-size: 1rem;
        padding: 1rem 1.5rem 1rem 3rem;
        border-radius: 25px;
      }
      
      .search-icon {
        left: 1rem;
        font-size: 1.2rem;
      }
      
      .ai-search-icon {
        left: 1rem;
        font-size: 1.2rem;
      }
      
      .books-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        margin-top: 2.5rem;
        padding: 0;
      }
      
      .book {
        padding: 1.5rem;
        border-radius: 20px;
      }
      
      .book-content {
        gap: 1.25rem;
      }
      
      img {
        width: 110px;
        max-height: 160px;
      }
      
      .info h2 {
        font-size: 1.3rem;
        margin-bottom: 1rem;
      }
      
      .info-item {
        margin: 0.5rem 0;
        padding: 0.6rem;
        flex-wrap: nowrap;
        gap: 0.75rem;
        border-radius: 10px;
      }
      
      .info-label {
        min-width: 75px;
        font-size: 0.8rem;
      }
      
      .info-value {
        font-size: 0.9rem;
      }
      
      .stock-badge {
        font-size: 0.8rem;
        padding: 0.5rem 1rem;
        border-radius: 18px;
      }
      
      .pagination {
        margin: 3rem 0 2rem;
        padding: 1rem;
        gap: 0.5rem;
      }
      
      .pagination button {
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
        min-width: 45px;
      }
      
      .pagination .page-info {
        margin: 0 1rem;
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
      }
    }
    
    /* Smartphones en mode portrait */
    @media (max-width: 480px) {
      .container {
        padding: 1.5rem 1rem;
      }
      
      h1 {
        font-size: 2rem;
        margin-bottom: 2.5rem;
        padding: 0 0.5rem;
        line-height: 1.1;
      }
      
      .search-container {
        padding: 0;
        margin-bottom: 1.5rem;
      }
      
      .ai-search-container {
        padding: 0;
        margin-bottom: 2rem;
      }
      
      .reset-container {
        padding: 0;
        margin-bottom: 1.5rem;
      }
      
      .reset-button {
        font-size: 0.875rem;
        padding: 0.75rem 1.25rem;
        border-radius: 20px;
      }
      
      #search {
        font-size: 1rem;
        padding: 1rem 1.25rem 1rem 2.75rem;
        border-radius: 25px;
      }
      
      #ai-search {
        width: 100%;
        font-size: 1rem;
        padding: 1rem 1.25rem 1rem 2.75rem;
        border-radius: 25px;
      }
      
      .search-icon {
        left: 1rem;
        font-size: 1.1rem;
      }
      
      .ai-search-icon {
        left: 1rem;
        font-size: 1.1rem;
      }
      
      .books-grid {
        gap: 1.25rem;
        margin-top: 2rem;
        padding: 0;
      }
      
      .book {
        padding: 1.25rem;
        border-radius: 20px;
        min-width: auto;
      }
      
      .book-content {
        flex-direction: row;
        gap: 1rem;
        align-items: flex-start;
      }
      
      .book-cover {
        flex-shrink: 0;
      }
      
      img {
        width: 90px;
        max-height: 130px;
      }
      
      .info {
        flex: 1;
        min-width: 0;

<body>
  <div class="container">
    <h1>📚 La bibliothèque du KotArdoise 📚</h1>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Rechercher un livre ou un auteur...">
    </div>
    
    <div class="ai-search-container">
      <span class="ai-search-icon">🤖</span>
      <input type="text" id="ai-search" placeholder="Décrivez le livre que vous cherchez...">
    </div>
    
    <div class="reset-container">
      <button id="reset-btn" class="reset-button">🔄 Afficher tous les livres</button>
    </div>
    
    <div id="livres" class="books-grid"></div>
    <div id="results-info" class="results-info"></div>
    <div id="pagination" class="pagination"></div>
  </div>

  <script>
    let allBooks = [];
    let filteredBooks = [];
    let currentPage = 1;
    const booksPerPage = 15; // Optimisé pour 1800 livres (120 pages max)

    // Cache localStorage pour optimiser la bande passante
    const CACHE_KEY = 'kotardoise_books_cache';
    const CACHE_VERSION = '1.0';
    const CACHE_DURATION = 10 * 60 * 1000; // 10 minutes en millisecondes - balance parfaite entre performance et fraîcheur

    function getCachedBooks() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (!cached) return null;
        
        const { data, timestamp, version } = JSON.parse(cached);
        const now = Date.now();
        const cacheAge = now - timestamp;
        
        // Vérifier si le cache est encore valide
        if (version === CACHE_VERSION && cacheAge < CACHE_DURATION) {
          const hoursOld = Math.round(cacheAge / (60 * 60 * 1000) * 10) / 10;
          console.log(`📦 Utilisation du cache local: ${data.length} livres (${hoursOld}h)`);
          return data;
        }
        
        // Cache expiré, le supprimer automatiquement
        console.log('🕒 Cache expiré, rechargement automatique...');
        localStorage.removeItem(CACHE_KEY);
        return null;
      } catch (error) {
        console.warn('Erreur lecture cache:', error);
        localStorage.removeItem(CACHE_KEY);
        return null;
      }
    }

    function setCachedBooks(data) {
      try {
        const cacheData = {
          data: data,
          timestamp: Date.now(),
          version: CACHE_VERSION
        };
        localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
        console.log(`💾 Cache mis à jour: ${data.length} livres sauvegardés`);
      } catch (error) {
        console.warn('Erreur sauvegarde cache:', error);
        // Storage plein, on continue sans cache
      }
    }

    // Monitoring de la bande passante - défini en premier
    let bandwidthUsage = {
      session: 0,
      images: 0,
      data: 0
    };

    function trackBandwidthUsage(type, bytes) {
      bandwidthUsage.session += bytes;
      bandwidthUsage[type] += bytes;
      
      // Log tous les 1MB
      if (bandwidthUsage.session % (1024 * 1024) < bytes) {
        console.log(`📊 Bande passante utilisée cette session: ${Math.round(bandwidthUsage.session / 1024)}KB`);
      }
    }

    function renderBooks(books, page = 1) {
      const container = document.getElementById("livres");
      const resultsInfo = document.getElementById("results-info");
      const pagination = document.getElementById("pagination");
      
      if (books.length === 0) {
        container.innerHTML = '<div class="no-results">Aucun livre trouvé 📚</div>';
        resultsInfo.innerHTML = '';
        pagination.innerHTML = '';
        return;
      }
      
      // Calcul de pagination
      const totalPages = Math.ceil(books.length / booksPerPage);
      const startIndex = (page - 1) * booksPerPage;
      const endIndex = startIndex + booksPerPage;
      const booksToShow = books.slice(startIndex, endIndex);
      
      // Affichage des informations de résultats
      resultsInfo.innerHTML = `
        <strong>${books.length}</strong> livre${books.length > 1 ? 's' : ''} trouvé${books.length > 1 ? 's' : ''} 
        | Page <strong>${page}</strong> sur <strong>${totalPages}</strong> 
        | Affichage de <strong>${startIndex + 1}</strong> à <strong>${Math.min(endIndex, books.length)}</strong>
      `;
      
      // Rendu des livres
      container.innerHTML = "";
      booksToShow.forEach((livre, index) => {
        const div = document.createElement("div");
        div.className = "book";
        div.style.animationDelay = `${index * 0.1}s`;

        const coverURL = `https://covers.openlibrary.org/b/isbn/${livre.ISBN}-M.jpg`; // Taille Medium au lieu de Large

        div.innerHTML = `
          <div class="book-content">
            <div class="book-cover">
              <img src="${coverURL}" 
                   alt="Couverture de ${livre.Titre}" 
                   onerror="this.src='https://via.placeholder.com/120x160/667eea/white?text=📚'" 
                   loading="lazy"
                   decoding="async"
                   width="120"
                   height="180"
                   onload="if(typeof trackBandwidthUsage === 'function') trackBandwidthUsage('images', 15000)"> <!-- ~15KB par image Medium -->
            </div>
            <div class="info">
              <h2>${livre.Titre}</h2>
              <div class="info-item">
                <span class="info-label">Auteur:</span>
                <span class="info-value">${livre.Auteur}</span>
              </div>
              <div class="info-item">
                <span class="info-label">Stock:</span>
                <span class="stock-badge ${
                  (livre.Stock === undefined || livre.Stock === '' || livre.Stock === null) ? 'undefined' : 
                  (livre.Stock == 0) ? 'out-of-stock' : ''
                }">${
                  (livre.Stock === undefined || livre.Stock === '' || livre.Stock === null) ? 'Non défini' : 
                  `${livre.Stock} ${(livre.Stock != 1) ? 'exemplaires' : 'exemplaire'}`
                }</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
      
      // Rendu de la pagination
      renderPagination(totalPages, page);
    }

    function renderPagination(totalPages, currentPage) {
      const pagination = document.getElementById("pagination");
      
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }
      
      let paginationHTML = '';
      
      // Bouton Précédent
      paginationHTML += `
        <button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>
          ← Précédent
        </button>
      `;
      
      // Logique des numéros de page
      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, currentPage + 2);
      
      // Première page
      if (startPage > 1) {
        paginationHTML += `<button onclick="changePage(1)" ${currentPage === 1 ? 'class="active"' : ''}>1</button>`;
        if (startPage > 2) {
          paginationHTML += '<span class="page-info">...</span>';
        }
      }
      
      // Pages autour de la page actuelle
      for (let i = startPage; i <= endPage; i++) {
        paginationHTML += `
          <button onclick="changePage(${i})" ${i === currentPage ? 'class="active"' : ''}>
            ${i}
          </button>
        `;
      }
      
      // Dernière page
      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          paginationHTML += '<span class="page-info">...</span>';
        }
        paginationHTML += `<button onclick="changePage(${totalPages})" ${currentPage === totalPages ? 'class="active"' : ''}>${totalPages}</button>`;
      }
      
      // Bouton Suivant
      paginationHTML += `
        <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>
          Suivant →
        </button>
      `;
      


      
      pagination.innerHTML = paginationHTML;
    }

    function changePage(page) {
      if (page < 1 || page > Math.ceil(filteredBooks.length / booksPerPage)) return;
      
      currentPage = page;
      renderBooks(filteredBooks, currentPage);
      
      // Scroll vers le haut
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetSearch() {
      // Vider les champs de recherche
      document.getElementById('search').value = '';
      document.getElementById('ai-search').value = '';
      
      // Réinitialiser la liste filtrée à tous les livres
      filteredBooks = [...allBooks];
      currentPage = 1;
      
      // Afficher tous les livres
      renderBooks(filteredBooks, currentPage);
      
      console.log(`🔄 Recherche réinitialisée: ${allBooks.length} livres affichés`);
    }

    function performSearch(query = '') {
      if (!query.trim()) {
        filteredBooks = [...allBooks];
      } else {
        const searchTerms = query.toLowerCase().split(' ').filter(term => term.length > 0);
        
        // Recherche exhaustive dans tous les livres chargés
        filteredBooks = allBooks.filter(livre => {
          const searchableText = [
            livre.Titre?.toLowerCase() || '',
            livre.Auteur?.toLowerCase() || ''
          ].join(' ');
          
          return searchTerms.every(term => searchableText.includes(term));
        });
      }
      
      currentPage = 1;
      renderBooks(filteredBooks, currentPage);
    }



    // Chargement progressif optimisé pour de gros volumes
    async function loadInitialBooks() {
      const container = document.getElementById("livres");
      const resultsInfo = document.getElementById("results-info");
      
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement de la bibliothèque...</div>';
      resultsInfo.innerHTML = '';

      try {
        // Vérifier le cache avant de faire une requête réseau
        const cachedBooks = getCachedBooks();
        if (cachedBooks) {
          allBooks = cachedBooks;
          console.log(`📚 Chargement depuis le cache: ${allBooks.length} livres`);
          
          // Afficher les livres du cache immédiatement
          filteredBooks = [...allBooks];
          renderBooks(filteredBooks, 1);
          
          // Vérifier discrètement s'il y a des mises à jour en arrière-plan
          checkForUpdatesInBackground();
          
        } else {
          // Pas de cache, charger depuis l'API
          await loadBooksFromAPI();
        }
        
      } catch (error) {
        console.error("Erreur lors du chargement des données :", error);
        container.innerHTML = '<div class="no-results">Erreur lors du chargement des données 😞</div>';
        resultsInfo.innerHTML = '';
      }
    }

    // Fonction pour charger depuis l'API
    async function loadBooksFromAPI() {
      console.log('📡 Téléchargement des données depuis l\'API...');
      const response = await fetch("https://opensheet.elk.sh/1LBcmGmEKOn8LscQunZrINNY8RWlKHkxT2qb6liInYuQ/1");
      
      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status} - ${response.statusText}`);
      }
      
      const data = await response.json();
      const estimatedSize = JSON.stringify(data).length;
      console.log(`📊 Données reçues: ${data.length} livres (${Math.round(estimatedSize / 1024)}KB)`);
      
      // Tracking de bande passante
      trackBandwidthUsage('data', estimatedSize);
      
      console.log(`📚 Chargement de ${data.length} livres...`);
      
      // Pour des volumes importants (>1000), traitement par batch pour éviter le blocage UI
      if (data.length > 1000) {
        allBooks = [];
        const batchSize = 200;
        
        for (let i = 0; i < data.length; i += batchSize) {
          const batch = data.slice(i, i + batchSize);
          allBooks = allBooks.concat(batch);
          
          // Petit délai pour permettre au browser de respirer
          if (i + batchSize < data.length) {
            await new Promise(resolve => setTimeout(resolve, 10));
          }
        }
        
        console.log(`📚 Traitement par batch terminé: ${allBooks.length} livres chargés`);
      } else {
        allBooks = data;
      }
      
      // Mettre à jour le cache avec les nouveaux livres chargés
      setCachedBooks(allBooks);
      
      console.log(`📚 Bibliothèque chargée: ${allBooks.length} livres - Recherche exhaustive disponible`);
      
      filteredBooks = [...allBooks];
      renderBooks(filteredBooks, 1);
    }

    // Vérification en arrière-plan pour les mises à jour (optionnelle avec cache court)
    async function checkForUpdatesInBackground() {
      try {
        // Attendre un peu plus longtemps avant de vérifier car le cache expire souvent
        await new Promise(resolve => setTimeout(resolve, 8000));
        
        console.log('🔍 Vérification des mises à jour en arrière-plan...');
        const response = await fetch("https://opensheet.elk.sh/1LBcmGmEKOn8LscQunZrINNY8RWlKHkxT2qb6liInYuQ/1");
        
        if (response.ok) {
          const newData = await response.json();
          
          // Comparer avec les données actuelles de manière plus précise
          const hasChanges = hasDataChanged(allBooks, newData);
          
          if (hasChanges) {
            console.log(`🔄 Mise à jour détectée - Le cache expirera automatiquement dans quelques minutes`);
            // Avec un cache de 10 minutes, pas besoin de notification urgente
            showUpdateNotification();
          } else {
            console.log('✅ Aucune mise à jour détectée');
          }
        }
      } catch (error) {
        console.log('🔍 Vérification mise à jour échouée (normal):', error.message);
      }
    }

    // Fonction pour détecter les changements dans les données
    function hasDataChanged(oldData, newData) {
      // Vérifier d'abord le nombre de livres
      if (oldData.length !== newData.length) {
        console.log(`📊 Changement de nombre: ${oldData.length} → ${newData.length} livres`);
        return true;
      }

      // Créer une signature rapide des données pour détecter les modifications
      const oldSignature = createDataSignature(oldData);
      const newSignature = createDataSignature(newData);
      
      if (oldSignature !== newSignature) {
        console.log('📊 Changement détecté dans le contenu des données');
        return true;
      }

      return false;
    }

    // Créer une signature des données pour détecter les changements
    function createDataSignature(data) {
      // Prendre un échantillon des premiers et derniers livres + quelques au milieu
      const sampleSize = Math.min(20, data.length);
      const step = Math.max(1, Math.floor(data.length / sampleSize));
      
      let signature = '';
      for (let i = 0; i < data.length; i += step) {
        const book = data[i];
        if (book) {
          signature += `${book.ISBN}-${book.Stock}-${book.Titre?.length || 0}|`;
        }
      }
      
      return signature;
    }

    // Notification discrète de mise à jour disponible
    function showUpdateNotification() {
      // Supprimer une notification existante si présente
      const existingNotification = document.querySelector('.update-notification');
      if (existingNotification) {
        existingNotification.remove();
      }

      const notification = document.createElement('div');
      notification.className = 'update-notification';
      notification.innerHTML = `
        <div style="
          position: fixed; 
          top: 20px; 
          right: 20px; 
          background: linear-gradient(135deg, #667eea, #764ba2); 
          color: white; 
          padding: 1rem 1.5rem; 
          border-radius: 12px; 
          box-shadow: 0 4px 20px rgba(0,0,0,0.2);
          z-index: 1000;
          font-weight: 500;
          cursor: pointer;
          transition: all 0.3s ease;
          max-width: 300px;
          font-size: 0.9rem;
          opacity: 0.9;
        " onclick="forceDataRefresh()">
          📚 Mise à jour disponible<br>
          <small>Cliquez pour voir maintenant (ou attendez le rafraîchissement automatique)</small>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      // Auto-supprimer après 20 secondes (plus long car moins urgent)
      setTimeout(() => {
        if (notification.parentNode) {
          notification.remove();
        }
      }, 20000);
    }

    // Fonction pour forcer le rafraîchissement des données
    async function forceDataRefresh() {
      try {
        console.log('🔄 Rafraîchissement forcé des données...');
        
        // Supprimer le cache
        localStorage.removeItem(CACHE_KEY);
        
        // Afficher le loader
        const container = document.getElementById("livres");
        container.innerHTML = '<div class="loading"><div class="spinner"></div>Mise à jour en cours...</div>';
        
        // Supprimer la notification
        const notification = document.querySelector('.update-notification');
        if (notification) {
          notification.remove();
        }
        
        // Recharger depuis l'API
        await loadBooksFromAPI();
        
        console.log('✅ Données mises à jour avec succès');
        
      } catch (error) {
        console.error('❌ Erreur lors de la mise à jour:', error);
        alert('Erreur lors de la mise à jour. Veuillez rafraîchir la page.');
      }
    }



    // Configuration de l'API via Netlify Functions
    async function performAISearch(query) {
      if (!query.trim()) {
        alert('Veuillez entrer une description du livre que vous cherchez.');
        return;
      }

      const aiSearchInput = document.getElementById('ai-search');
      const originalPlaceholder = aiSearchInput.placeholder;
      
      try {
        aiSearchInput.disabled = true;
        aiSearchInput.placeholder = 'Recherche IA en cours...';

        // Approche intelligente pour gros volumes : pré-filtrage puis envoi complet
        let booksToSend;
        
        if (allBooks.length > 1000) {
          // 1. Effectuer d'abord une recherche textuelle rapide pour réduire l'ensemble
          const quickSearchTerms = query.toLowerCase().split(' ')
            .filter(term => term.length > 2) // Ignorer les mots trop courts
            .slice(0, 5); // Limiter aux 5 premiers mots clés
          
          let preFilteredBooks = allBooks;
          
          if (quickSearchTerms.length > 0) {
            preFilteredBooks = allBooks.filter(livre => {
              const searchableText = [
                livre.Titre?.toLowerCase() || '',
                livre.Auteur?.toLowerCase() || ''
              ].join(' ');
              
              // Au moins un terme doit correspondre pour le pré-filtrage
              return quickSearchTerms.some(term => searchableText.includes(term));
            });
          }
          
          // Si le pré-filtrage donne encore trop de résultats, prendre les plus récents/populaires
          if (preFilteredBooks.length > 800) {
            preFilteredBooks = preFilteredBooks.slice(0, 800);
          }
          
          console.log(`🤖 Pré-filtrage: ${preFilteredBooks.length} livres sur ${allBooks.length} envoyés à l'IA`);
          
          booksToSend = preFilteredBooks.map(book => ({
            titre: book.Titre,
            auteur: book.Auteur,
            isbn: book.ISBN
          }));
        } else {
          // Pour moins de 1000 livres, envoyer tout
          booksToSend = allBooks.map(book => ({
            titre: book.Titre,
            auteur: book.Auteur,
            isbn: book.ISBN
          }));
        }

        // Appel à notre fonction Netlify au lieu de Gemini directement
        const apiUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
          ? '/api/ai-search'  // Pour le développement local
          : '/.netlify/functions/ai-search';  // Pour la production

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            query: query,
            booksData: booksToSend
          })
        });

        if (!response.ok) {
          throw new Error(`Erreur API: ${response.status}`);
        }

        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error || 'Erreur lors de la recherche IA');
        }

        const matchingISBNs = data.matchingISBNs || [];

        // Filtrer les livres basés sur les ISBN retournés par l'IA
        if (Array.isArray(matchingISBNs) && matchingISBNs.length > 0) {
          filteredBooks = allBooks.filter(book => 
            matchingISBNs.includes(book.ISBN)
          );
          
          // Réorganiser selon l'ordre de pertinence donné par l'IA
          filteredBooks.sort((a, b) => {
            const indexA = matchingISBNs.indexOf(a.ISBN);
            const indexB = matchingISBNs.indexOf(b.ISBN);
            return indexA - indexB;
          });
        } else {
          filteredBooks = [];
        }

        currentPage = 1;
        renderBooks(filteredBooks, currentPage);
        
        // Afficher un message de résultat
        if (filteredBooks.length > 0) {
          document.getElementById('search').value = ''; // Vider la recherche classique
          console.log(`🤖 Recherche IA: ${filteredBooks.length} livre(s) trouvé(s) pour "${query}"`);
        } else {
          alert(`Aucun livre trouvé pour la description : "${query}"`);
        }

      } catch (error) {
        console.error('Erreur lors de la recherche IA:', error);
        alert('Erreur lors de la recherche IA. Veuillez réessayer.');
      } finally {
        aiSearchInput.disabled = false;
        aiSearchInput.placeholder = originalPlaceholder;
      }
    }

    // Recherche optimisée avec cache et debounce intelligent
    let searchTimeout;
    let searchCache = new Map(); // Cache des résultats de recherche
    
    document.getElementById("search").addEventListener("input", function () {
      const query = this.value;
      
      clearTimeout(searchTimeout);
      
      // Pour des volumes importants, ajuster le délai selon la longueur
      const debounceDelay = allBooks.length > 1000 ? 400 : 300;
      
      searchTimeout = setTimeout(() => {
        // Vérifier le cache d'abord
        const cacheKey = query.toLowerCase().trim();
        if (searchCache.has(cacheKey)) {
          filteredBooks = searchCache.get(cacheKey);
          currentPage = 1;
          renderBooks(filteredBooks, currentPage);
          return;
        }
        
        performSearch(query);
        
        // Mettre en cache les résultats pour les requêtes fréquentes
        if (query.length > 2) {
          searchCache.set(cacheKey, [...filteredBooks]);
          
          // Limiter la taille du cache
          if (searchCache.size > 50) {
            const firstKey = searchCache.keys().next().value;
            searchCache.delete(firstKey);
          }
        }
      }, debounceDelay);
    });

    // Event listeners pour la recherche IA
    document.getElementById('ai-search').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const query = this.value;
        performAISearch(query);
      }
    });

    // Event listener pour le bouton de réinitialisation
    document.getElementById('reset-btn').addEventListener('click', function() {
      resetSearch();
    });

    // Démarrer le chargement initial
    loadInitialBooks();

    // Rendre la fonction de rafraîchissement accessible globalement
    window.forceDataRefresh = forceDataRefresh;
  </script>
</body>
</html>
