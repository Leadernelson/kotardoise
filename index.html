<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>📚 La bibliothèque du KotArdoise</title>
  
  <!-- Chargement prioritaire du CSS mobile -->
  <link rel="stylesheet" href="styles/mobile.css" media="(max-width: 768px)">
  <link rel="stylesheet" href="styles/mobile-performance.css" media="(max-width: 768px)">
  <link rel="stylesheet" href="styles/advanced-animations.css" media="(min-width: 769px)">
  
  <!-- Préconnexion aux domaines externes pour améliorer les performances -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://covers.openlibrary.org">
  <link rel="preconnect" href="https://opensheet.elk.sh">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 4rem;
      font-size: 3.5rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
      letter-spacing: -1px;
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    
    .search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
      position: relative;
      width: 100%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .ai-search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 3.5rem;
      position: relative;
      width: 100%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    
    #search {
      padding: 1.25rem 1.75rem 1.25rem 3.5rem;
      width: 100%;
      max-width: 600px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      font-weight: 400;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    #ai-search {
      padding: 1.25rem 1.75rem 1.25rem 3.5rem;
      width: 100%;
      max-width: 600px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      font-weight: 400;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    #search:focus {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(102, 126, 234, 0.2);
      background: white;
      border: 1px solid rgba(102, 126, 234, 0.3);
    }
    
    #ai-search:focus {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(102, 126, 234, 0.2);
      background: white;
      border: 1px solid rgba(102, 126, 234, 0.3);
    }
    
    #ai-search.searching {
      background: linear-gradient(90deg, rgba(102, 126, 234, 0.05), rgba(255, 255, 255, 0.98), rgba(102, 126, 234, 0.05));
      border: 1px solid rgba(102, 126, 234, 0.5);
      box-shadow: 0 12px 40px rgba(102, 126, 234, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
      transform: none;
    }
    
    .search-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      color: #666;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    
    .ai-search-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      color: #666;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    
    .ai-search-loader {
      position: absolute;
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: aiSearchSpin 1s linear infinite, aiSearchPulse 2s ease-in-out infinite;
      display: none;
      z-index: 10;
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
    }
    
    @keyframes aiSearchSpin {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(360deg); }
    }
    
    @keyframes aiSearchPulse {
      0%, 100% { 
        opacity: 1;
        transform: translateY(-50%) scale(1);
      }
      50% { 
        opacity: 0.7;
        transform: translateY(-50%) scale(1.1);
      }
    }
    
    #search:focus + .search-icon,
    #ai-search:focus + .ai-search-icon {
      color: #667eea;
      transform: translateY(-50%) scale(1.1);
    }
    
    .reset-container {
      display: flex;
      justify-content: center;
      margin-bottom: 3rem;
      width: 100%;
    }
    
    .reset-button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }
    
    .reset-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.6s ease;
    }
    
    .reset-button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15), 0 4px 15px rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.4);
    }
    
    .reset-button:hover::before {
      left: 100%;
    }
    
    .reset-button:active {
      transform: translateY(-1px);
    }
    
    .books-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      margin-top: 3rem;
      width: 100%;
      padding: 0;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .book {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(25px);
      border-radius: 24px;
      padding: 1.75rem;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.12),
        0 8px 25px rgba(0, 0, 0, 0.08),
        0 2px 10px rgba(0, 0, 0, 0.04);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: visible;
      width: 100%;
      min-width: 0;
      max-width: none;
    }
    
    /* Ligne de dégradé supprimée pour améliorer l'esthétique */
    
    .book::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
      border-radius: 24px;
    }
    
    .book:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow:
        0 35px 80px rgba(0, 0, 0, 0.18),
        0 15px 35px rgba(0, 0, 0, 0.12),
        0 5px 15px rgba(102, 126, 234, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
    }
    
    .book-content {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      position: relative;
      z-index: 1;
      width: 100%;
      overflow: visible;
    }
    
    .book-cover {
      position: relative;
      flex-shrink: 0;
    }
    
    .book-cover::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      border-radius: 18px;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }
    
    .book:hover .book-cover::before {
      opacity: 1;
    }
    
    img {
      width: 130px;
      height: auto;
      max-height: 190px;
      object-fit: contain;
      border-radius: 16px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.2),
        0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .book:hover img {
      transform: scale(1.08) rotateY(5deg);
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25),
        0 8px 20px rgba(0, 0, 0, 0.15);
    }
    
    .info {
      flex: 1;
      min-width: 0;
      overflow: visible;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }
    
    .info h2 {
      margin: 0 0 1rem;
      font-size: 1.4rem;
      font-weight: 600;
      color: #2d3748;
      line-height: 1.25;
      word-wrap: break-word;
      position: relative;
      padding-bottom: 0.5rem;
    }
    
    .info h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 1px;
    }
    
    .info-item {
      display: flex;
      align-items: flex-start;
      margin: 0.75rem 0;
      padding: 0.75rem;
      min-width: 0;
      gap: 1rem;
      background: rgba(248, 250, 252, 0.6);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: visible;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    
    .info-item:hover {
      background: rgba(102, 126, 234, 0.08);
      border-color: rgba(102, 126, 234, 0.2);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    
    .info-label {
      font-weight: 600;
      color: #4a5568;
      min-width: 80px;
      font-size: 0.875rem;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }
    
    .info-value {
      color: #2d3748;
      font-weight: 400;
      flex: 1;
      word-wrap: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      width: 100%;
      font-size: 0.95rem;
      line-height: 1.5;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 24px;
    }
    
    .stock-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 1.25rem;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      background: linear-gradient(135deg, #48bb78, #38a169);
      color: white;
      box-shadow:
        0 6px 20px rgba(72, 187, 120, 0.3),
        0 3px 10px rgba(72, 187, 120, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      white-space: nowrap;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      min-width: fit-content;
      width: auto;
      backdrop-filter: blur(5px);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      transform: translateZ(0); /* Force hardware acceleration pour éviter les tremblements */
      backface-visibility: hidden;
      will-change: transform;
    }
    
    .stock-badge::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s ease;
    }
    
    .stock-badge:hover::before {
      left: 100%;
    }
    
    .stock-badge.out-of-stock {
      background: linear-gradient(135deg, #f56565, #e53e3e);
      box-shadow:
        0 6px 20px rgba(245, 101, 101, 0.3),
        0 3px 10px rgba(245, 101, 101, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    .stock-badge.undefined {
      background: linear-gradient(135deg, #a0aec0, #718096);
      box-shadow:
        0 6px 20px rgba(160, 174, 192, 0.3),
        0 3px 10px rgba(160, 174, 192, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    .stock-badge:hover {
      transform: translateY(-2px) scale(1.05) translateZ(0);
      box-shadow:
        0 8px 25px rgba(72, 187, 120, 0.4),
        0 4px 15px rgba(72, 187, 120, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .stock-badge.out-of-stock:hover {
      transform: translateY(-2px) scale(1.05) translateZ(0);
      box-shadow:
        0 8px 25px rgba(245, 101, 101, 0.4),
        0 4px 15px rgba(245, 101, 101, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .stock-badge.undefined:hover {
      transform: translateY(-2px) scale(1.05) translateZ(0);
      box-shadow:
        0 8px 25px rgba(160, 174, 192, 0.4),
        0 4px 15px rgba(160, 174, 192, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 300px;
      color: white;
      font-size: 1.3rem;
      font-weight: 500;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1.5rem;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin: 4rem 0 3rem;
      flex-wrap: wrap;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(15px);
    }
    
    .pagination button {
      padding: 1rem 1.25rem;
      border: none;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      color: #4a5568;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(15px);
      min-width: 50px;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .pagination button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
      transition: left 0.6s ease;
    }
    
    .pagination button:hover:not(:disabled) {
      background: white;
      transform: translateY(-3px) scale(1.05);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.2),
        0 4px 12px rgba(102, 126, 234, 0.1);
      border-color: rgba(102, 126, 234, 0.3);
    }
    
    .pagination button:hover:not(:disabled)::before {
      left: 100%;
    }
    
    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    
    .pagination button.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow:
        0 8px 25px rgba(102, 126, 234, 0.5),
        0 4px 15px rgba(102, 126, 234, 0.3);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
    }
    
    .pagination .page-info {
      color: white;
      font-weight: 600;
      margin: 0 1.5rem;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      backdrop-filter: blur(15px);
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }
    
    .results-info {
      text-align: center;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 2rem;
      font-size: 1rem;
      font-weight: 500;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    
    .results-info strong {
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    
    .no-results {
      text-align: center;
      color: white;
      font-size: 1.5rem;
      margin-top: 4rem;
      opacity: 0.9;
      padding: 3rem 2rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      font-weight: 500;
    }
    @media (max-width: 1024px) {
      .container {
        padding: 2.5rem 1.5rem;
      }
      
      .books-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
        padding: 0;
      }
      
      h1 {
        font-size: 3rem;
        margin-bottom: 3.5rem;
      }
      
      .book {
        padding: 1.5rem;
      }
      
      img {
        width: 120px;
        max-height: 175px;
      }
    }
    
    /* Tablettes en mode paysage et petits écrans */
    @media (max-width: 768px) {
      .container {
        padding: 2rem 1rem;
      }
      
      h1 {
        font-size: 2.5rem;
        margin-bottom: 3rem;
        line-height: 1.15;
      }
      
      .search-container {
        margin-bottom: 1.75rem;
        padding: 0 0.5rem;
        max-width: 100%;
      }
      
      .ai-search-container {
        margin-bottom: 2.5rem;
        padding: 0 0.5rem;
        max-width: 100%;
      }
      
      .reset-container {
        margin-bottom: 2rem;
        padding: 0 0.5rem;
      }
      
      .reset-button {
        font-size: 0.9rem;
        padding: 0.875rem 1.5rem;
      }
      
      #search {
        max-width: 100%;
        font-size: 1rem;
        padding: 1rem 1.5rem 1rem 3rem;
        border-radius: 25px;
      }
      
      #ai-search {
        width: 100%;
        font-size: 1rem;
        padding: 1rem 1.5rem 1rem 3rem;
        border-radius: 25px;
      }
      
      .search-icon {
        left: 1rem;
        font-size: 1.2rem;
      }
      
      .ai-search-icon {
        left: 1rem;
        font-size: 1.2rem;
      }
      
      .books-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        margin-top: 2.5rem;
        padding: 0;
      }
      
      .book {
        padding: 1.5rem;
        border-radius: 20px;
      }
      
      .book-content {
        gap: 1.25rem;
      }
      
      img {
        width: 110px;
        max-height: 160px;
      }
      
      .info h2 {
        font-size: 1.3rem;
        margin-bottom: 1rem;
      }
      
      .info-item {
        margin: 0.5rem 0;
        padding: 0.6rem;
        flex-wrap: nowrap;
        gap: 0.75rem;
        border-radius: 10px;
      }
      
      .info-label {
        min-width: 75px;
        font-size: 0.8rem;
      }
      
      .info-value {
        font-size: 0.9rem;
      }
      
      .stock-badge {
        font-size: 0.8rem;
        padding: 0.5rem 1rem;
        border-radius: 18px;
      }
      
      .pagination {
        margin: 3rem 0 2rem;
        padding: 1rem;
        gap: 0.5rem;
      }

    /* Amélioration des interactions tactiles */
    @media (hover: none) and (pointer: coarse) {

        gap: 0.5rem;

      .genre-btn {

    }
  </style>

<body>
  <div class="container">
    <h1>📚 La bibliothèque du KotArdoise 📚</h1>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Rechercher un livre ou un auteur...">
    </div>
    
    <div class="ai-search-container">
      <span class="ai-search-icon">🤖</span>
      <input type="text" id="ai-search" placeholder="Décrivez le livre que vous cherchez...">
      <div class="ai-search-loader" id="ai-search-loader"></div>
    </div>
    
    <div class="genre-filters">
      <button class="genre-btn active" data-genre="tous">📚 Tous</button>
      <button class="genre-btn" data-genre="Horreur">🧛 Horreur</button>
      <button class="genre-btn" data-genre="Romance">💕 Romance</button>
      <button class="genre-btn" data-genre="Science-fiction">🚀 Science-fiction</button>
      <button class="genre-btn" data-genre="Fantasy">🐉 Fantasy</button>
      <button class="genre-btn" data-genre="Thriller">😱 Thriller</button>
      <button class="genre-btn" data-genre="Aventure">⚔️ Aventure</button>
      <button class="genre-btn" data-genre="Policier">🕵️ Policier</button>
      <button class="genre-btn" data-genre="Historique">📜 Historique</button>
      <button class="genre-btn" data-genre="Drame">🎭 Drame</button>
      <button class="genre-btn" data-genre="Comédie">😄 Comédie</button>
      <button class="genre-btn" data-genre="Inconnu">❓ Inconnu</button>
    </div>
    
    <div class="reset-container">
      <button id="reset-btn" class="reset-button">🔄 Afficher tous les livres</button>
    </div>
    
    <div id="livres" class="books-grid"></div>
    <div id="results-info" class="results-info"></div>
    <div id="pagination" class="pagination"></div>
  </div>

  <script>
    let allBooks = [];
    let filteredBooks = [];
    let currentPage = 1;
    const booksPerPage = 10; // Nombre uniforme de livres par page partout (basé sur mobile optimisé)
    let selectedGenre = 'tous'; // Genre sélectionné par défaut

    // Détection d'appareil mobile pour optimisations spécifiques (gardée pour autres optimisations)
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

    // Cache localStorage pour optimiser la bande passante
    const CACHE_KEY = 'kotardoise_books_cache';
    const CACHE_VERSION = '1.3'; // Version mise à jour pour optimisations mobile
    const CACHE_DURATION = isMobile ? 60 * 60 * 1000 : 30 * 60 * 1000; // Cache plus long sur mobile (1h vs 30min)

    // Fonction pour nettoyer les anciens caches problématiques
    function cleanupOldCache() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const { version } = JSON.parse(cached);
          // Supprimer tout cache avec une version antérieure à 1.2
          if (!version || version !== CACHE_VERSION) {
            console.log('🧹 Suppression de l\'ancien cache bugué (version:', version, ')');
            localStorage.removeItem(CACHE_KEY);
            
            // Supprimer aussi d'autres clés de cache qui pourraient causer des problèmes
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              if (key && key.includes('kotardoise')) {
                keysToRemove.push(key);
              }
            }
            keysToRemove.forEach(key => {
              if (key !== CACHE_KEY) {
                localStorage.removeItem(key);
                console.log('🧹 Suppression clé cache:', key);
              }
            });
            
            return true; // Cache nettoyé
          }
        }
        return false; // Pas de nettoyage nécessaire
      } catch (error) {
        console.warn('Erreur nettoyage cache:', error);
        localStorage.removeItem(CACHE_KEY);
        return true;
      }
    }

    function getCachedBooks() {
      try {
        // Nettoyer d'abord les anciens caches
        const wasCleanedUp = cleanupOldCache();
        if (wasCleanedUp) {
          console.log('✅ Cache nettoyé - rechargement depuis l\'API');
          return null;
        }
        
        const cached = localStorage.getItem(CACHE_KEY);
        if (!cached) return null;
        
        const { data, timestamp, version } = JSON.parse(cached);
        const now = Date.now();
        const cacheAge = now - timestamp;
        
        // Vérifier si le cache est encore valide
        if (version === CACHE_VERSION && cacheAge < CACHE_DURATION) {
          const hoursOld = Math.round(cacheAge / (60 * 60 * 1000) * 10) / 10;
          console.log(`📦 Utilisation du cache local: ${data.length} livres (${hoursOld}h)`);
          return data;
        }
        
        // Cache expiré, le supprimer automatiquement
        console.log('🕒 Cache expiré, rechargement automatique...');
        localStorage.removeItem(CACHE_KEY);
        return null;
      } catch (error) {
        console.warn('Erreur lecture cache:', error);
        localStorage.removeItem(CACHE_KEY);
        return null;
      }
    }

    function setCachedBooks(data) {
      try {
        const cacheData = {
          data: data,
          timestamp: Date.now(),
          version: CACHE_VERSION
        };
        localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
        console.log(`💾 Cache mis à jour: ${data.length} livres sauvegardés`);
      } catch (error) {
        console.warn('Erreur sauvegarde cache:', error);
        // Storage plein, on continue sans cache
      }
    }

    // Monitoring de la bande passante - défini en premier
    let bandwidthUsage = {
      session: 0,
      images: 0,
      data: 0
    };

    function trackBandwidthUsage(type, bytes) {
      bandwidthUsage.session += bytes;
      bandwidthUsage[type] += bytes;
      
      // Log tous les 1MB
      if (bandwidthUsage.session % (1024 * 1024) < bytes) {
        console.log(`📊 Bande passante utilisée cette session: ${Math.round(bandwidthUsage.session / 1024)}KB`);
      }
    }

    function renderBooks(books, page = 1) {
      const container = document.getElementById("livres");
      const resultsInfo = document.getElementById("results-info");
      const pagination = document.getElementById("pagination");
      
      if (books.length === 0) {
        container.innerHTML = '<div class="no-results">Aucun livre trouvé 📚</div>';
        resultsInfo.innerHTML = '';
        pagination.innerHTML = '';
        return;
      }
      
      // Calcul de pagination uniforme partout
      const totalPages = Math.ceil(books.length / booksPerPage);
      const startIndex = (page - 1) * booksPerPage;
      const endIndex = startIndex + booksPerPage;
      const booksToShow = books.slice(startIndex, endIndex);
      
      // Affichage des informations de résultats
      resultsInfo.innerHTML = `
        <strong>${books.length}</strong> livre${books.length > 1 ? 's' : ''} trouvé${books.length > 1 ? 's' : ''} 
        | Page <strong>${page}</strong> sur <strong>${totalPages}</strong> 
        | Affichage de <strong>${startIndex + 1}</strong> à <strong>${Math.min(endIndex, books.length)}</strong>
      `;
      
      // Rendu uniforme partout - utiliser le rendu par batch qui fonctionne bien
      container.innerHTML = "";
      renderBooksInBatches(container, booksToShow);
      
      // Rendu de la pagination
      renderPagination(totalPages, page);
    }

    // Fonction de rendu optimisé par batch (utilisée partout maintenant)
    function renderBooksInBatches(container, booksToShow) {
      const batchSize = 4; // Traiter 4 livres à la fois partout (optimal)
      let currentIndex = 0;
      
      function renderBatch() {
        const endIndex = Math.min(currentIndex + batchSize, booksToShow.length);
        
        for (let i = currentIndex; i < endIndex; i++) {
          const livre = booksToShow[i];
          const div = createBookElement(livre, i);
          container.appendChild(div);
        }
        
        currentIndex = endIndex;
        
        if (currentIndex < booksToShow.length) {
          // Utiliser requestAnimationFrame pour le prochain batch
          requestAnimationFrame(renderBatch);
        }
      }
      
      // Commencer le rendu par batch
      renderBatch();
    }

    // Fonction pour gérer les erreurs d'image et tenter une recherche alternative
    async function handleImageError(imgElement, auteur, titre, fallbackURL) {
      try {
        // Nettoyer les paramètres
        const author = encodeURIComponent(auteur.trim());
        const title = encodeURIComponent(titre.trim());
        
        // Rechercher le livre dans OpenLibrary
        const searchURL = `https://openlibrary.org/search.json?title=${title}&author=${author}&limit=1`;
        
        const response = await fetch(searchURL);
        const data = await response.json();
        
        if (data.docs && data.docs.length > 0) {
          const book = data.docs[0];
          
          // Essayer d'abord avec l'ISBN trouvé
          if (book.isbn && book.isbn.length > 0) {
            const isbn = book.isbn[0];
            const coverURL = `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`;
            
            // Tester si cette couverture existe
            const testImg = new Image();
            testImg.onload = function() {
              imgElement.src = coverURL;
              console.log(`Couverture trouvée via recherche ISBN: ${isbn} pour "${titre}"`);
            };
            testImg.onerror = function() {
              // Si l'ISBN ne fonctionne pas, essayer avec l'OLID
              tryOLID();
            };
            testImg.src = coverURL;
            return;
          }
          
          // Fonction pour essayer avec l'OLID (OpenLibrary ID)
          function tryOLID() {
            if (book.key) {
              const olid = book.key.replace('/works/', '');
              const olidCoverURL = `https://covers.openlibrary.org/b/olid/${olid}-M.jpg`;
              
              const testImg2 = new Image();
              testImg2.onload = function() {
                imgElement.src = olidCoverURL;
                console.log(`Couverture trouvée via OLID: ${olid} pour "${titre}"`);
              };
              testImg2.onerror = function() {
                // Aucune couverture trouvée, utiliser le fallback
                imgElement.src = fallbackURL;
                console.log(`Aucune couverture trouvée pour "${titre}" par ${auteur}`);
              };
              testImg2.src = olidCoverURL;
            } else {
              imgElement.src = fallbackURL;
              console.log(`Aucune couverture trouvée pour "${titre}" par ${auteur}`);
            }
          }
        } else {
          // Aucun résultat de recherche
          imgElement.src = fallbackURL;
          console.log(`Aucun livre trouvé dans la recherche pour "${titre}" par ${auteur}`);
        }
      } catch (error) {
        console.error('Erreur lors de la recherche de couverture:', error);
        imgElement.src = fallbackURL;
      }
      
      // Empêcher les erreurs en boucle
      imgElement.onerror = null;
    }

    // Fonction pour obtenir l'URL de la couverture
    function getCoverURL(livre) {
      const imageSize = 'M';
      const fallbackURL = 'https://via.placeholder.com/120x160/667eea/white?text=📚';
      
      // Si l'ISBN existe et n'est pas vide, l'utiliser
      if (livre.ISBN && livre.ISBN.trim() !== '') {
        return {
          primaryURL: `https://covers.openlibrary.org/b/isbn/${livre.ISBN.trim()}-${imageSize}.jpg`,
          fallbackURL: fallbackURL
        };
      }
      
      // Construire le nom complet de l'auteur à partir des colonnes séparées
      const nomComplet = ((livre.Prénom || '') + ' ' + (livre.Famille || '')).trim();
      
      // Sinon, utiliser l'auteur et le titre pour rechercher
      if (nomComplet && livre.Titre) {
        // Nettoyer et encoder les paramètres pour la recherche
        const author = encodeURIComponent(nomComplet.trim());
        const title = encodeURIComponent(livre.Titre.trim());
        
        // Utiliser la recherche OpenLibrary par titre et auteur
        return {
          primaryURL: `https://covers.openlibrary.org/b/title/${title}-${imageSize}.jpg`,
          fallbackURL: fallbackURL,
          searchURL: `https://openlibrary.org/search.json?title=${title}&author=${author}&limit=1`
        };
      }
      
      // Si ni ISBN ni auteur/titre disponibles, utiliser directement le fallback
      return {
        primaryURL: fallbackURL,
        fallbackURL: fallbackURL
      };
    }

    // Fonction pour créer un élément livre
    function createBookElement(livre, index) {
      const div = document.createElement("div");
      div.className = "book";
      div.style.animationDelay = `${index * 0.1}s`;

      // Construire le nom complet de l'auteur à partir des colonnes séparées
      const nomComplet = ((livre.Prénom || '') + ' ' + (livre.Famille || '')).trim() || 'Auteur inconnu';

      // Obtenir l'URL de la couverture selon la disponibilité des données
      const coverInfo = getCoverURL(livre);
      const coverURL = coverInfo.primaryURL;
      const fallbackURL = coverInfo.fallbackURL;
      
      // Mêmes paramètres de chargement partout
      const loadingAttribute = 'loading="lazy" decoding="async"';

      // Créer une fonction de gestion d'erreur personnalisée
      const onErrorHandler = (!livre.ISBN || livre.ISBN.trim() === '') && coverInfo.searchURL 
        ? `handleImageError(this, '${nomComplet}', '${livre.Titre}', '${fallbackURL}')`
        : `this.onerror=null; this.src='${fallbackURL}'; console.log('Fallback image loaded for: ${livre.Titre}');`;

      div.innerHTML = `
        <div class="book-content">
          <div class="book-cover">
            <img src="${coverURL}" 
                 alt="Couverture de ${livre.Titre}" 
                 onerror="${onErrorHandler}" 
                 ${loadingAttribute}
                 width="120"
                 height="180"
                 style="object-fit: cover; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;"
                 onload="if(typeof trackBandwidthUsage === 'function') trackBandwidthUsage('images', 25000)"> 
          </div>
          <div class="info">
            <h2>${livre.Titre}</h2>
            <div class="info-item">
              <span class="info-label">Auteur:</span>
              <span class="info-value">${nomComplet}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Stock:</span>
              <span class="stock-badge ${
                (livre.Stock === undefined || livre.Stock === '' || livre.Stock === null) ? 'undefined' : 
                (livre.Stock == 0 || livre.Stock === '0') ? 'Emprunté' : ''
              }">${
                (livre.Stock === undefined || livre.Stock === '' || livre.Stock === null) ? 'Non défini' : livre.Stock
              }</span>
            </div>
            ${livre.Genre && livre.Genre.trim() !== '' ? `
            <div class="info-item">
              <span class="info-label">Genre:</span>
              <span class="info-value">${livre.Genre}</span>
            </div>
            ` : ''}
          </div>
        </div>
      `;
      
      return div;
    }

    function renderPagination(totalPages, currentPage) {
      const pagination = document.getElementById("pagination");
      
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }
      
      let paginationHTML = '';
      
      // Bouton Précédent
      paginationHTML += `
        <button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>
          ← Précédent
        </button>
      `;
      
      // Logique des numéros de page
      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, currentPage + 2);
      
      // Première page
      if (startPage > 1) {
        paginationHTML += `<button onclick="changePage(1)" ${currentPage === 1 ? 'class="active"' : ''}>1</button>`;
        if (startPage > 2) {
          paginationHTML += '<span class="page-info">...</span>';
        }
      }
      
      // Pages autour de la page actuelle
      for (let i = startPage; i <= endPage; i++) {
        paginationHTML += `
          <button onclick="changePage(${i})" ${i === currentPage ? 'class="active"' : ''}>
            ${i}
          </button>
        `;
      }
      
      // Dernière page
      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          paginationHTML += '<span class="page-info">...</span>';
        }
        paginationHTML += `<button onclick="changePage(${totalPages})" ${currentPage === totalPages ? 'class="active"' : ''}>${totalPages}</button>`;
      }
      
      // Bouton Suivant
      paginationHTML += `
        <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>
          Suivant →
        </button>
      `;
      


      
      pagination.innerHTML = paginationHTML;
    }

    function changePage(page) {
      if (page < 1 || page > Math.ceil(filteredBooks.length / booksPerPage)) return;
      
      currentPage = page;
      renderBooks(filteredBooks, currentPage);
      
      // Scroll vers le haut avec une animation douce partout
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function performSearch(query = '') {
      let booksToFilter = [...allBooks];
      
      // Appliquer le filtre de genre d'abord
      if (selectedGenre !== 'tous') {
        booksToFilter = applyGenreFilter(booksToFilter, selectedGenre);
      }
      
      // Appliquer la recherche textuelle ensuite
      if (!query.trim()) {
        filteredBooks = booksToFilter;
      } else {
        const searchTerms = query.toLowerCase().split(' ').filter(term => term.length > 0);
        
        // Recherche exhaustive dans tous les livres chargés
        filteredBooks = booksToFilter.filter(livre => {
          // Construire le nom complet de l'auteur
          const nomComplet = ((livre.Prénom || '') + ' ' + (livre.Famille || '')).toLowerCase().trim();
          
          const searchableText = [
            livre.Titre?.toLowerCase() || '',
            nomComplet,
            livre.Prénom?.toLowerCase() || '',
            livre.Famille?.toLowerCase() || ''
          ].join(' ');
          
          return searchTerms.every(term => searchableText.includes(term));
        });
      }
      
      currentPage = 1;
      renderBooks(filteredBooks, currentPage);
    }

    // Fonction pour appliquer le filtre par genre
    function applyGenreFilter(books, genre) {
      if (genre === 'tous') {
        return books;
      }
      
      if (genre === 'Inconnu') {
        // Filtrer les livres sans genre, avec genre vide, ou avec genre "Inconnu"
        return books.filter(livre => {
          if (!livre.Genre || livre.Genre.trim() === '') return true;
          const genres = livre.Genre.split(',').map(g => g.trim().toLowerCase());
          return genres.includes('inconnu');
        });
      }
      
      // Filtrer les livres qui contiennent le genre sélectionné
      return books.filter(livre => {
        if (!livre.Genre) return false;
        // Gérer les genres multiples séparés par des virgules
        const genres = livre.Genre.split(',').map(g => g.trim().toLowerCase());
        return genres.includes(genre.toLowerCase());
      });
    }

    // Fonction pour filtrer par genre (appelée par les boutons)
    function filterByGenre(genre) {
      selectedGenre = genre;
      
      // Mettre à jour les boutons actifs
      document.querySelectorAll('.genre-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.genre === genre) {
          btn.classList.add('active');
        }
      });
      
      // Récupérer la valeur de recherche actuelle
      const searchQuery = document.getElementById('search').value;
      
      // Réappliquer la recherche avec le nouveau filtre de genre
      performSearch(searchQuery);
      
      console.log(`🎭 Filtrage par genre: ${genre}`);
    }

    // Fonction pour détecter les changements dans les données
    function hasDataChanged(oldData, newData) {
      // Vérifier d'abord le nombre de livres
      if (oldData.length !== newData.length) {
        console.log(`📊 Changement de nombre: ${oldData.length} → ${newData.length} livres`);
        return true;
      }

      // Créer une signature rapide des données pour détecter les modifications
      const oldSignature = createDataSignature(oldData);
      const newSignature = createDataSignature(newData);
      
      if (oldSignature !== newSignature) {
        console.log('📊 Changement détecté dans le contenu des données');
        return true;
      }

      return false;
    }

    // Créer une signature des données pour détecter les changements
    function createDataSignature(data) {
      // Prendre un échantillon des premiers et derniers livres + quelques au milieu
      const sampleSize = Math.min(20, data.length);
      const step = Math.max(1, Math.floor(data.length / sampleSize));
      
      let signature = '';
      for (let i = 0; i < data.length; i += step) {
        const book = data[i];
        if (book) {
          signature += `${book.ISBN}-${book.Stock}-${book.Titre?.length || 0}|`;
        }
      }
      
      return signature;
    }

    // Configuration de l'API via Netlify Functions
    async function performAISearch(query) {
      if (!query.trim()) {
        alert('Veuillez entrer une description du livre que vous cherchez.');
        return;
      }

      const aiSearchInput = document.getElementById('ai-search');
      const aiSearchLoader = document.getElementById('ai-search-loader');

      try {
        // Afficher le loader et désactiver le champ

        aiSearchInput.placeholder = 'Recherche IA en cours...';
        aiSearchLoader.style.display = 'block';

        // Approche pour gros volumes : envoyer TOUS les livres à l'IA pour des résultats optimaux
        let booksToSend;
        
        console.log(`🤖 Envoi de TOUS les livres à l'IA: ${allBooks.length} livres (requête: "${query}")`);
        
        // Envoyer tous les livres avec un maximum de détails pour une recherche optimale
        booksToSend = allBooks.map((book, index) => {
          // Construire le nom complet de l'auteur
          const nomComplet = ((book.Prénom || '') + ' ' + (book.Famille || '')).trim();
          
          return {
            id: index, // Identifiant unique pour les livres sans ISBN
            titre: book.Titre,
            prenom: book.Prénom || '',
            famille: book.Famille || '',
            auteur: nomComplet, // Garder aussi la version complète pour la compatibilité
            isbn: book.ISBN,
            // Ajouter tous les champs disponibles pour maximiser les correspondances
            genre: book.Genre || '',
            editeur: book.Editeur || '',
            description: book.Description || '',
            annee: book.Annee || '',
            serie: book.Serie || '',
            tome: book.Tome || ''
          };
        });

        // Debug: afficher quelques ISBNs pour vérifier le format
        console.log('📚 Échantillon d\'ISBNs dans les données:', allBooks.slice(0, 5).map(b => b.ISBN));

        // Appel à notre fonction Netlify au lieu de Gemini directement
        const apiUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
          ? '/api/ai-search'  // Pour le développement local
          : '/.netlify/functions/ai-search';  // Pour la production

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            query: query,
            booksData: booksToSend
          })
        });

        if (!response.ok) {
          throw new Error(`Erreur API: ${response.status}`);
        }

        const data = await response.json();
        
        if (!data.success) {
          const errorMsg = data.error || 'Erreur lors de la recherche IA';
          console.error('Erreur API:', errorMsg);
          
          // Message d'erreur spécifique selon le type d'erreur
          if (errorMsg.includes('API key not configured')) {
            alert('Service de recherche IA temporairement indisponible. Veuillez utiliser la recherche classique.');
          } else {
            alert(`Erreur de recherche IA: ${errorMsg}`);
          }
          return;
        }

        const matchingISBNs = data.matchingISBNs || [];
        console.log(`🤖 IA a retourné ${matchingISBNs.length} ID(s):`, matchingISBNs.slice(0, 5), matchingISBNs.length > 5 ? '...' : '');
        
        // Commencer avec tous les livres ou les livres filtrés par genre
        let booksToSearch = [...allBooks];
        if (selectedGenre !== 'tous') {
          booksToSearch = applyGenreFilter(booksToSearch, selectedGenre);
          console.log(`🎭 Application du filtre genre "${selectedGenre}": ${booksToSearch.length} livres`);
        }
        
        // Filtrer les livres basés sur les IDs retournés par l'IA (ISBN ou index)
        if (Array.isArray(matchingISBNs) && matchingISBNs.length > 0) {
          console.log('🔍 Filtrage par IDs IA...');
          
          // Fonction pour normaliser les IDs (ISBNs ou indices numériques)
          const normalizeID = (id) => (id || '').toString().replace(/[-\s]/g, '').trim();
          
          filteredBooks = booksToSearch.filter((book, index) => {
            // Essayer d'abord l'ISBN, puis l'index comme fallback
            const bookISBN = normalizeID(book.ISBN);
            const bookIndex = allBooks.indexOf(book).toString(); // Utiliser l'index dans allBooks
            
            const hasMatch = matchingISBNs.some(aiID => {
              const normalizedAiID = normalizeID(aiID);
              return normalizedAiID === bookISBN || normalizedAiID === bookIndex;
            });
            
            if (hasMatch) {
              console.log(`✅ Correspondance trouvée: "${book.Titre}" (ISBN: ${book.ISBN || 'N/A'}, Index: ${allBooks.indexOf(book)})`);
            }
            return hasMatch;
          });
          
          console.log(`📊 ${filteredBooks.length} livre(s) trouvé(s) sur ${matchingISBNs.length} ID(s) retournés`);
          
          // Réorganiser selon l'ordre de pertinence donné par l'IA
          filteredBooks.sort((a, b) => {
            const getBookID = (book, index) => normalizeID(book.ISBN) || allBooks.indexOf(book).toString();
            
            const indexA = matchingISBNs.findIndex(aiID => {
              const normalizedAiID = normalizeID(aiID);
              const bookAID = getBookID(a, allBooks.indexOf(a));
              return normalizedAiID === bookAID;
            });
            
            const indexB = matchingISBNs.findIndex(aiID => {
              const normalizedAiID = normalizeID(aiID);
              const bookBID = getBookID(b, allBooks.indexOf(b));
              return normalizedAiID === bookBID;
            });
            
            return indexA - indexB;
          });
        } else {
          // Fallback: si l'IA ne trouve rien, faire une recherche textuelle large
          console.log('🔍 Fallback: recherche textuelle large');
          const searchTerms = query.toLowerCase().split(' ').filter(term => term.length > 2);
          
          filteredBooks = booksToSearch.filter(livre => {
            // Construire le nom complet de l'auteur
            const nomComplet = ((livre.Prénom || '') + ' ' + (livre.Famille || '')).toLowerCase().trim();
            
            const searchableText = [
              livre.Titre?.toLowerCase() || '',
              nomComplet,
              livre.Prénom?.toLowerCase() || '',
              livre.Famille?.toLowerCase() || '',
              livre.Genre?.toLowerCase() || '',
              livre.Description?.toLowerCase() || ''
            ].join(' ');
            
            // Recherche flexible avec correspondances partielles
            return searchTerms.some(term => {
              // Recherche exacte
              if (searchableText.includes(term)) return true;
              
              // Correspondances partielles pour mots longs
              if (term.length >= 4) {
                const words = searchableText.split(' ');
                return words.some(word => 
                  word.startsWith(term) || 
                  (word.length >= 4 && term.includes(word.substring(0, 3)))
                );
              }
              
              // Recherche de similarité pour des mots comme "voldemort" -> "harry potter"
              const synonymMap = {
                'voldemort': ['harry', 'potter', 'poudlard', 'hogwarts', 'magic'],
                'hermione': ['harry', 'potter', 'granger'],
                'dumbledore': ['harry', 'potter', 'albus'],
                'poudlard': ['harry', 'potter', 'hogwarts'],
                'magie': ['fantasy', 'magic', 'wizard', 'sorcier'],
                'guerre': ['battle', 'fight', 'combat', 'militaire'],
                'amour': ['love', 'romance', 'romantic']
              };
              
              if (synonymMap[term]) {
                return synonymMap[term].some(synonym => searchableText.includes(synonym));
              }
              
              return false;
            });
          });
        }

        currentPage = 1;
        renderBooks(filteredBooks, currentPage);
        
        // Afficher un message de résultat amélioré
        if (filteredBooks.length > 0) {
          document.getElementById('search').value = ''; // Vider la recherche classique
          const source = matchingISBNs && matchingISBNs.length > 0 ? 'IA' : 'recherche textuelle élargie';
          console.log(`🤖 Recherche ${source}: ${filteredBooks.length} livre(s) trouvé(s) pour "${query}"`);
        } else {
          alert(`Aucun livre trouvé pour la description : "${query}". Essayez avec des mots-clés différents ou plus généraux.`);
        }

      } catch (error) {
        console.error('Erreur lors de la recherche IA:', error);
        alert('Erreur lors de la recherche IA. Veuillez réessayer.');
      } finally {
        // Masquer le loader et réactiver le champ dans tous les cas
        aiSearchInput.disabled = false;
        aiSearchInput.classList.remove('searching');
        aiSearchInput.placeholder = originalPlaceholder;
        aiSearchLoader.style.display = 'none';
      }
    }

    // Recherche optimisée avec cache et debounce intelligent
    let searchTimeout;
    let searchCache = new Map(); // Cache des résultats de recherche
    
    document.getElementById("search").addEventListener("input", function () {
      const query = this.value;
      
      clearTimeout(searchTimeout);
      
      // Délai optimisé pour mobile - plus long pour éviter trop de requêtes
      const debounceDelay = isMobile ? 600 : (allBooks.length > 1000 ? 400 : 300);
      
      searchTimeout = setTimeout(() => {
        // Vérifier le cache d'abord
        const cacheKey = query.toLowerCase().trim();
        if (searchCache.has(cacheKey)) {
          filteredBooks = searchCache.get(cacheKey);
          currentPage = 1;
          renderBooks(filteredBooks, currentPage);
          return;
        }
        
        performSearch(query);
        
        // Mettre en cache les résultats pour les requêtes fréquentes
        if (query.length > 2) {
          searchCache.set(cacheKey, [...filteredBooks]);
          
          // Limiter la taille du cache - plus petit sur mobile
          const maxCacheSize = isMobile ? 20 : 50;
          if (searchCache.size > maxCacheSize) {
            const firstKey = searchCache.keys().next().value;
            searchCache.delete(firstKey);
          }
        }
      }, debounceDelay);
    });

    // Démarrer le chargement initial
    loadInitialBooks();

    // Optimisation mobile : Intersection Observer pour un lazy loading avancé
    if (isMobile && 'IntersectionObserver' in window) {
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            if (img.dataset.src) {
              img.src = img.dataset.src;
              img.removeAttribute('data-src');
              observer.unobserve(img);
            }
          }
        });
      }, {
        rootMargin: '50px' // Commencer à charger 50px avant que l'image soit visible
      });
      
      // Observer toutes les images avec data-src
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('img[data-src]').forEach(img => {
          imageObserver.observe(img);
        });
      });
    }

    // Fonction d'urgence pour nettoyer complètement le cache (accessible via console)
    window.clearAllCache = function() {
      console.log('🧹 Nettoyage complet du cache...');
      localStorage.clear();
      sessionStorage.clear();
      console.log('✅ Cache complètement nettoyé - rechargez la page');
      alert('Cache nettoyé ! Rechargez la page (F5) pour appliquer les corrections.');
    };
    
    // Fonction pour diagnostiquer les problèmes de cache
    window.debugCache = function() {
      console.log('🔍 Diagnostic du cache:');
      console.log('- Cache version attendue:', CACHE_VERSION);
      
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const { version, timestamp, data } = JSON.parse(cached);
          console.log('- Cache version actuelle:', version);
          console.log('- Cache timestamp:', new Date(timestamp));
          console.log('- Cache taille:', data?.length || 0, 'livres');
          console.log('- Cache age:', Math.round((Date.now() - timestamp) / 60000), 'minutes');
        } else {
          console.log('- Aucun cache trouvé');
        }
        
        console.log('- Autres clés localStorage:');
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          console.log('  -', key);
        }
      } catch (error) {
        console.error('Erreur diagnostic:', error);
      }
    };
    
    console.log('🔧 Fonctions de débogage disponibles:');
    console.log('- window.clearAllCache() : Nettoie complètement le cache');
    console.log('- window.debugCache() : Affiche les informations de cache');
    console.log('- window.forceDataRefresh() : Force le rechargement des données');
  </script>
</body>
</html>
