<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>📚 La bibliothèque du KotArdoise</title>
  
  <!-- Preconnect pour améliorer les performances -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://covers.openlibrary.org">
  <link rel="preconnect" href="https://opensheet.elk.sh">
  
  <!-- DNS Prefetch pour les domaines externes -->
  <link rel="dns-prefetch" href="//via.placeholder.com">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Meta tags pour PWA -->
  <meta name="theme-color" content="#764ba2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KotArdoise">
  
  <!-- Favicon optimisé -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23667eea;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23764ba2;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23grad)'/%3E%3Ctext x='50' y='65' font-family='serif' font-size='60' text-anchor='middle' fill='white'%3E📚%3C/text%3E%3C/svg%3E">
  
  <!-- CSS critique inline pour le rendu immédiat -->
  <style>
    /* CSS Critical Path - Styles essentiels pour le first paint */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      line-height: 1.6;
      color: #333;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 4rem;
      font-size: 3.5rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      letter-spacing: -1px;
      line-height: 1.1;
    }
    
    /* Styles critiques pour les éléments de recherche */
    .search-container,
    .ai-search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
      position: relative;
      width: 100%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .ai-search-container {
      margin-bottom: 3.5rem;
    }
    
    #search,
    #ai-search {
      padding: 1.25rem 1.75rem 1.25rem 3.5rem;
      width: 100%;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.98);
      outline: none;
      font-weight: 400;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
    }
    
    .search-icon,
    .ai-search-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      color: #666;
      pointer-events: none;
    }
    
    /* Loading state critique */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 300px;
      color: white;
      font-size: 1.3rem;
      text-align: center;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Media queries critiques pour mobile */
    @media (max-width: 768px) {
      .container {
        padding: 2rem 1rem;
      }
      
      h1 {
        font-size: 2.5rem;
        margin-bottom: 3rem;
      }
      
      #search,
      #ai-search {
        font-size: 1rem;
        padding: 1rem 1.5rem 1rem 3rem;
      }
      
      .search-icon,
      .ai-search-icon {
        left: 1rem;
        font-size: 1.2rem;
      }
    }
    
    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      
      #search,
      #ai-search {
        padding: 1rem 1.25rem 1rem 2.75rem;
      }
    }
    
    /* Styles critiques pour le bouton reset */
    .reset-container {
      display: flex;
      justify-content: center;
      margin-bottom: 3rem;
      width: 100%;
    }
    
    .reset-button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 500;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.3s ease;
    }
    
    .reset-button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    
    /* Styles critiques pour les conteneurs de contenu */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 3rem;
      width: 100%;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .results-info {
      text-align: center;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 2rem;
      font-size: 1rem;
      font-weight: 500;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin: 4rem 0 3rem;
      flex-wrap: wrap;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
    }
    
    .no-results {
      text-align: center;
      color: white;
      font-size: 1.5rem;
      margin-top: 4rem;
      opacity: 0.9;
      padding: 3rem 2rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 24px;
    }
    
    @media (max-width: 768px) {
      .books-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        margin-top: 2.5rem;
      }
      
      .reset-button {
        font-size: 0.9rem;
        padding: 0.875rem 1.5rem;
      }
    }
    
    @media (max-width: 480px) {
      .reset-button {
        font-size: 0.875rem;
        padding: 0.75rem 1.25rem;
      }
      
      .books-grid {
        gap: 1.25rem;
        margin-top: 2rem;
      }
    }
  </style>
  
  <!-- Preload des polices critiques -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
  
  <!-- Preload des ressources critiques -->
  <link rel="preload" href="styles/main.css" as="style">
  <link rel="preload" href="js/app.js" as="script">
  
  <!-- CSS non-critique chargé de manière asynchrone -->
  <link rel="stylesheet" href="styles/main.css" media="print" onload="this.media='all'; this.onload=null;">
  <noscript><link rel="stylesheet" href="styles/main.css"></noscript>
  
  <!-- CSS mobile chargé conditionnellement -->
  <link rel="stylesheet" href="styles/mobile.css" media="screen and (max-width: 1024px)">
  
  <!-- CSS animations chargé de manière différée -->
  <link rel="stylesheet" href="styles/advanced-animations.css" media="print" onload="this.media='all'; this.onload=null;">
  <noscript><link rel="stylesheet" href="styles/advanced-animations.css"></noscript>
</head>
<body>
  <div class="container">
    <h1>📚 La bibliothèque du KotArdoise 📚</h1>
    
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Rechercher un livre ou un auteur..." autocomplete="off">
    </div>
    
    <div class="ai-search-container">
      <span class="ai-search-icon">🤖</span>
      <input type="text" id="ai-search" placeholder="Décrivez le livre que vous cherchez..." autocomplete="off">
    </div>
    
    <div class="reset-container">
      <button id="reset-btn" class="reset-button" type="button">🔄 Afficher tous les livres</button>
    </div>
    
    <!-- Conteneurs pour le contenu dynamique -->
    <div id="livres" class="books-grid">
      <div class="loading">
        <div class="spinner"></div>
        Initialisation...
      </div>
    </div>
    <div id="results-info" class="results-info"></div>
    <div id="pagination" class="pagination"></div>
  </div>

  <!-- JavaScript principal chargé de manière différée -->
  <script>
    // Script critique minimal pour l'initialisation
    window.addEventListener('DOMContentLoaded', function() {
      // Chargement différé du script principal
      const script = document.createElement('script');
      script.src = 'js/app.js';
      script.async = true;
      script.onload = function() {
        console.log('✅ Application initialisée avec succès');
      };
      script.onerror = function() {
        console.error('❌ Erreur de chargement du script principal');
        document.getElementById('livres').innerHTML = '<div class="no-results">Erreur de chargement de l\'application 😞</div>';
      };
      document.head.appendChild(script);
    });
    
    // Service Worker pour la mise en cache (optionnel)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          console.log('SW registered: ', registration);
        }).catch(function(registrationError) {
          console.log('SW registration failed: ', registrationError);
        });
      });
    }
  </script>
</body>
</html>
