name: Keep Supabase Alive

on:
  schedule:
    # Exécuter 2 fois par jour (04:00 et 16:00 UTC) pour éviter la mise en pause de Supabase (seuil de 7 jours)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Permet de lancer le ping manuellement depuis l'onglet Actions sur GitHub

permissions:
  contents: write

jobs:
  keep-alive:
    name: Ping Supabase REST & GraphQL API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Supabase Keep-Alive Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/keep-supabase-alive.js

      - name: Prevent GitHub from Disabling Scheduled Workflow
        continue-on-error: true
        uses: gautamkrishnar/keepalive-workflow@v2


