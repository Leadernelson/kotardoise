name: Enrich Book Metadata

on:
  workflow_dispatch: # Permet de lancer l'enrichissement manuellement depuis l'interface GitHub

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run enrichment script
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: node scripts/enrich-books.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books-metadata.json
          git diff-index --quiet HEAD || git commit -m "Auto-enrich library metadata [skip ci]"
          git push
