name: Enrich Book Metadata

on:
  workflow_dispatch:
    inputs:
      max-calls:
        description: "Nombre max d'appels Google Books pour ce run (0 = plafond du jour)"
        required: false
        default: "600"
      cap:
        description: "Plafond quotidien Google Books pour ce run"
        required: false
        default: "900"

  # Une fois par jour, à 04:17 UTC (heure creuse : GitHub décourage les
  # exécutions à l'heure ronde, leur file d'attente sature)
  schedule:
    - cron: "17 4 * * *"

# Un seul run à la fois : évite que deux exécutions se partagent le quota
# et ne se marchent pas dessus dans books-metadata.json
concurrency:
  group: enrich-metadata
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # Le script interroge la BnF (sans quota) puis Google (plafonné).
    # 30 min suffisent largement ; au-delà, c'est qu'il tourne à vide.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Afficher le quota déjà consommé aujourd'hui
        run: |
          if [ -f .quota-state.json ]; then cat .quota-state.json; else echo "aucun état de quota (premier run)"; fi

      - name: Enrichir les métadonnées
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          GOOGLE_DAILY_CAP: ${{ inputs.cap || '900' }}
        run: node scripts/enrich-books.js | tee enrich.log

      - name: Résumé du reliquat
        run: node scripts/review-queue.js --limit=0 | tail -n 20

      - name: Publier le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-log
          path: enrich.log
          retention-days: 7

      - name: Commit et push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .quota-state.json est ignoré par Git en local, mais il doit être
          # versionné ici : c'est lui qui empêche plusieurs runs le même jour
          # de dépasser le quota de 1000 requêtes.
          git add books-metadata.json
          git add -f .quota-state.json 2>/dev/null || true
          git diff-index --quiet HEAD && echo "Aucun changement, rien à publier." && exit 0
          git commit -m "Auto-enrich library metadata [skip ci]"
          git push
